<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece2cd">
<title>Generative Noodles</title>
<style>
  /* Tokens aus DESIGN.md des Bitcoin-Wiki-Visualizers, Sepia-Vermessungskarte. */
  :root {
    --paper: #ece2cd;
    --paper-bright: #f2ead6;
    --ink: #5c4a34;
    --ink-soft: #6b5a42;
    --ink-faint: #8a7a5e;
    --line: rgba(74,58,40,0.68);
    --border: rgba(110,92,64,0.25);
    --border-strong: rgba(110,92,64,0.4);
    --bar: rgba(110,92,64,0.18);
    --page: 16px;
    --panel-pad: 12px;
    --control: 8px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--paper); overflow: hidden; overscroll-behavior: none;
    color: var(--ink);
    font: 400 13px/1.4 ui-sans-serif, system-ui, sans-serif;
  }

  #stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 28px; }
  #art {
    /* aspect-ratio plus both max sizes lets the sheet shrink to fit either way */
    width: auto; height: auto; max-width: 100%; max-height: 100%;
    background: var(--paper-bright); border: 1px solid var(--border-strong);
  }

  /* Panel und Klappe hängen zusammen: die Klappe wandert mit dem Panelrand. */
  #ui {
    position: fixed; z-index: 11;
    top: calc(var(--page) + var(--safe-t)); left: var(--page);
    display: flex; align-items: flex-start;
  }

  #panel {
    width: 276px; max-width: calc(100vw - 2 * var(--page) - 18px);
    max-height: calc(100vh - 2 * var(--page) - var(--safe-t) - var(--safe-b));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: var(--panel-pad);
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 4px 0 0 4px;
  }
  #panel[hidden] { display: none; }

  #toggle {
    flex: none; width: 18px; height: 34px; padding: 0;
    font: inherit; font-size: 12px; line-height: 1;
    color: var(--ink); background: var(--paper);
    border: 1px solid var(--border-strong); border-left: none;
    border-radius: 0 4px 4px 0; cursor: pointer;
  }
  #panel[hidden] + #toggle { border-left: 1px solid var(--border-strong); border-radius: 4px; }

  #panel h1 { margin: 0 0 3px; font-size: 15px; font-weight: 600; color: var(--ink); }
  #panel .sub { margin: 0 0 var(--panel-pad); font-size: 12px; color: var(--ink-faint); }
  #panel h2 {
    margin: var(--panel-pad) 0 var(--control);
    font-size: 12px; font-weight: 400; color: var(--ink-faint);
    border-top: 1px solid var(--border); padding-top: var(--control);
  }

  .row { margin-bottom: var(--control); }
  .row label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 3px; font-size: 12px; color: var(--ink-soft);
  }
  .row label .val { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .check {
    display: flex; align-items: center; gap: var(--control);
    margin-bottom: var(--control); font-size: 12px; color: var(--ink-soft); cursor: pointer;
  }
  .check input { accent-color: var(--ink); width: 14px; height: 14px; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; display: block;
    width: 100%; height: 18px; background: transparent; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--bar); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -6px;
    width: 14px; height: 14px; border: none; border-radius: 3px; background: var(--ink);
  }
  input[type=range]::-moz-range-track { height: 2px; background: var(--bar); }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: none; border-radius: 3px; background: var(--ink);
  }
  input[type=number] {
    width: 100%; padding: 5px 7px; font: inherit; font-size: 12px;
    color: var(--ink); background: var(--paper-bright);
    border: 1px solid var(--border-strong); border-radius: 4px;
  }
  .pair { display: flex; gap: var(--control); }
  .pair .row { flex: 1; }

  #toggle:focus-visible, button.b:focus-visible, .unit:focus-visible, input:focus-visible {
    outline: 1px solid var(--ink); outline-offset: 2px;
  }

  .buttons { display: flex; gap: var(--control); margin-bottom: var(--panel-pad); flex-wrap: wrap; }
  button.b, .unit {
    font: inherit; font-size: 12px; color: var(--ink); background: transparent;
    border: 1px solid var(--border-strong); border-radius: 4px; cursor: pointer;
  }
  button.b { flex: 1 1 30%; padding: 7px 4px; }
  button.b[aria-pressed=true] { background: var(--ink); color: var(--paper-bright); }
  h2 .unit { float: right; margin-top: -3px; padding: 2px 7px; }

  #stats {
    margin-top: var(--panel-pad); padding-top: var(--control);
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums;
  }

  #hint {
    position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--page) + var(--safe-b));
    color: var(--ink-faint); font-size: 11px;
    pointer-events: none; text-align: center;
  }
  #hint b { font-weight: 600; }

  @media (max-width: 680px), (max-height: 520px) {
    #stage { padding: 14px; }
    #ui { top: auto; bottom: calc(var(--page) + var(--safe-b)); align-items: flex-end; }
    #panel { width: calc(100vw - 2 * var(--page) - 18px); max-height: 62vh; }
    #hint { display: none; }
  }
</style>
</head>
<body>

<div id="stage"><svg id="art" xmlns="http://www.w3.org/2000/svg"></svg></div>

<div id="ui">
<div id="panel">
  <h1>Noodles</h1>
  <p class="sub">Bendy segments grown into a grid. The SVG is ready for a pen plotter.</p>

  <div class="buttons">
    <button class="b" id="btnRandom">Randomize</button>
    <button class="b" id="btnGrid">Grid</button>
    <button class="b" id="btnSave">Save SVG</button>
  </div>

  <h2>Paper <button class="unit" id="btnUnit">cm</button></h2>
  <div class="pair">
    <div class="row"><label>Width<span class="val"></span></label><input type="number" id="pw" value="29.7" min="1" max="200" step=".1"></div>
    <div class="row"><label>Height<span class="val"></span></label><input type="number" id="ph" value="21" min="1" max="200" step=".1"></div>
  </div>
  <div class="row"><label>Margin<span class="val" id="v_margin"></span></label><input type="range" id="margin" min="0" max="5" step=".1" value="1.5"></div>
  <div class="row"><label>Pen size<span class="val" id="v_pen"></span></label><input type="range" id="pen" min=".1" max="2" step=".05" value=".5"></div>

  <h2>Grid</h2>
  <div class="row"><label>Columns<span class="val" id="v_gw"></span></label><input type="range" id="gw" min="2" max="48" step="1" value="18"></div>
  <div class="row"><label>Rows<span class="val" id="v_gh"></span></label><input type="range" id="gh" min="2" max="48" step="1" value="14"></div>

  <h2>Noodles</h2>
  <div class="row"><label>Count<span class="val" id="v_num"></span></label><input type="range" id="num" min="1" max="120" step="1" value="30"></div>
  <div class="row"><label>Min length<span class="val" id="v_minLen"></span></label><input type="range" id="minLen" min="2" max="40" step="1" value="4"></div>
  <div class="row"><label>Max length<span class="val" id="v_maxLen"></span></label><input type="range" id="maxLen" min="2" max="40" step="1" value="14"></div>
  <div class="row"><label>Thickness<span class="val" id="v_thick"></span></label><input type="range" id="thick" min=".2" max=".95" step=".01" value=".62"></div>
  <label class="check"><input type="checkbox" id="overlaps" checked> Let noodles cross</label>
  <h2>Graphics</h2>
  <div class="buttons">
    <button class="b" id="btnHead">Head</button>
    <button class="b" id="btnTail">Tail</button>
    <button class="b" id="btnJoin">Joiner</button>
    <button class="b" id="btnGfxReset">Reset</button>
  </div>
  <input type="file" id="gfxFile" accept=".svg,image/svg+xml" hidden>
  <div class="row"><label>Joiners<span class="val" id="v_joiners"></span></label><input type="range" id="joiners" min="0" max="1" step=".05" value="0"></div>

  <h2>Mask</h2>
  <div class="buttons">
    <button class="b" id="btnPaint">Paint cells</button>
    <button class="b" id="btnMask">Load image</button>
    <button class="b" id="btnClear">Clear</button>
  </div>
  <input type="file" id="maskFile" accept="image/*" hidden>

  <h2>Seed</h2>
  <div class="row"><input type="number" id="seed" value="1" min="0" step="1"></div>

  <div id="stats"></div>
</div>
<button id="toggle" aria-label="Panel ein- und ausklappen">‹</button>
</div>

<div id="hint"><b>R</b> randomize · <b>G</b> grid · <b>X</b> paint cells · <b>I</b> mask · <b>S</b> save SVG</div>

<script>
(function () {
  "use strict";

  var DPI = 96;
  var UNITS = {
    cm: { px: DPI / 2.54, paper: { min: 1, max: 200, step: .1 }, margin: { max: 5, step: .1 } },
    in: { px: DPI, paper: { min: .5, max: 60, step: .5 }, margin: { max: 2, step: .1 } }
  };
  var unit = "cm";
  var svg = document.getElementById("art");

  // ---- geometry -----------------------------------------------------------
  // Everything sits on a square grid, so a noodle is just a chain of cells and
  // every turn is exactly 90 degrees. That means the outline needs no offset
  // maths: straight cells are parallel lines, corners are concentric arcs.

  function left(d) { return { x: d.y, y: -d.x }; }          // screen-left of d
  function turnOf(a, b) { return a.x * b.y - a.y * b.x; }   // >0 = right turn

  // The built-in joiner, the twist from the original sketch.
  var TWIST = { vb: [0, 0, 100, 100], inner:
    '<path d="M50,83.2C54,50,100,50,100,0"/>' +
    '<path d="M73.8,50.2C86.9,60,100,72.3,100,100"/>' +
    '<path d="M50.5,16.8C46.5,50,0,50,0,100"/>' +
    '<path d="M26.6,49.7C13.5,39.9,0,27.7,0,0"/>' };

  // One side of the noodle as a chain: a start point plus segments to follow.
  // A segment of type "M" is a jump, which is how end and joiner graphics cut
  // the outline open.
  function sideChain(centers, dirs, sgn, s, w, ends, gaps) {
    var half = w / 2, i;
    // A graphic occupies a full noodle width, the built-in cap only half of it.
    var inHead = ends.head ? s / 2 - w : s / 2 - half;
    var inTail = ends.tail ? s / 2 - w : s / 2 - half;
    var n0 = left(dirs[0]);
    var start = {
      x: centers[0].x - dirs[0].x * inHead + n0.x * sgn * half,
      y: centers[0].y - dirs[0].y * inHead + n0.y * sgn * half
    };
    var segs = [];

    for (i = 0; i < dirs.length; i++) {
      var d = dirs[i], nl = left(d);
      var mid = { x: (centers[i].x + centers[i + 1].x) / 2, y: (centers[i].y + centers[i + 1].y) / 2 };
      var pt = { x: mid.x + nl.x * sgn * half, y: mid.y + nl.y * sgn * half };
      var t = i > 0 ? turnOf(dirs[i - 1], d) : 0;

      if (i > 0 && t === 0 && gaps.has(i)) {
        var g = gaps.get(i);
        segs.push({ t: "L", p: { x: centers[i].x - d.x * g + nl.x * sgn * half,
                                 y: centers[i].y - d.y * g + nl.y * sgn * half } });
        segs.push({ t: "M", p: { x: centers[i].x + d.x * g + nl.x * sgn * half,
                                 y: centers[i].y + d.y * g + nl.y * sgn * half } });
        segs.push({ t: "L", p: pt });
      } else if (i > 0 && t !== 0) {
        // Outside of the bend gets the long radius, inside the short one.
        segs.push({ t: "A", p: pt, r: s / 2 + sgn * t * half, sweep: t > 0 ? 1 : 0 });
      } else {
        segs.push({ t: "L", p: pt });
      }
    }

    var last = centers.length - 1, dl = dirs[dirs.length - 1], nlast = left(dl);
    segs.push({ t: "L", p: {
      x: centers[last].x + dl.x * inTail + nlast.x * sgn * half,
      y: centers[last].y + dl.y * inTail + nlast.y * sgn * half
    }});
    return { start: start, segs: segs };
  }

  function fmt(v) { return Math.round(v * 100) / 100; }

  function cmd(g) {
    if (g.t === "A") return "A" + fmt(g.r) + " " + fmt(g.r) + " 0 0 " + g.sweep + " " + fmt(g.p.x) + " " + fmt(g.p.y);
    return (g.t === "M" ? "M" : "L") + fmt(g.p.x) + " " + fmt(g.p.y);
  }

  // The ring runs left side forwards, over the tail, right side backwards, over
  // the head. Without jumps that closes into one path; each jump splits it.
  function ringToPath(startPt, ring) {
    var cut = -1, out = [], i;
    for (i = 0; i < ring.length; i++) if (ring[i].t === "M") { cut = i; break; }
    if (cut < 0) {
      out.push("M" + fmt(startPt.x) + " " + fmt(startPt.y));
      for (i = 0; i < ring.length; i++) out.push(cmd(ring[i]));
      out.push("Z");
    } else {
      for (i = 0; i < ring.length; i++) out.push(cmd(ring[(cut + i) % ring.length]));
    }
    return out.join(" ");
  }

  // Graphics are drawn on a square whose bottom edge (y = vb height) meets the
  // noodle and whose x axis spans the noodle width, as in the original sketch.
  function placeGraphic(g, base, out, w, penPx) {
    var l = left(out), q = { x: -l.x, y: -l.y };
    var sx = w / g.vb[2], sy = w / g.vb[3];
    var m = [q.x * sx, q.y * sx, -out.x * sy, -out.y * sy,
             base.x + out.x * w - q.x * w / 2, base.y + out.y * w - q.y * w / 2];
    return '<g transform="matrix(' + m.map(fmt).join(" ") + ") translate(" +
           fmt(-g.vb[0]) + " " + fmt(-g.vb[1]) +
           ')" fill="none" stroke="#4a3a28" stroke-opacity=".68" stroke-width="' +
           fmt(penPx / sy) + '">' + g.inner + "</g>";
  }

  function noodleParts(cells, gw, s, ox, oy, w, gfx, chance, seed, index, penPx, crossAt) {
    var centers = cells.map(function (c) {
      return { x: ox + (c % gw + .5) * s, y: oy + (Math.floor(c / gw) + .5) * s };
    });
    var dirs = [], i;
    for (i = 0; i < centers.length - 1; i++) {
      dirs.push({
        x: Math.sign(centers[i + 1].x - centers[i].x),
        y: Math.sign(centers[i + 1].y - centers[i].y)
      });
    }

    var half = w / 2;
    var gaps = new Map();

    // A noodle passing over this one leaves a gap wide enough to read as an
    // underpass: its own width plus a little air on each side.
    var crossGap = Math.min(half + 2 * penPx, s / 2);
    if (crossAt) crossAt.forEach(function (i) { gaps.set(i, crossGap); });

    var joiner = gfx.joiner || (chance > 0 ? TWIST : null);
    var joiners = new Set();
    if (joiner && chance > 0) {
      var rnd = rngFrom(seed + 7919 * (index + 1));
      for (i = 1; i < dirs.length; i++) {
        if (turnOf(dirs[i - 1], dirs[i]) === 0 && !gaps.has(i) && rnd() < chance) {
          joiners.add(i);
          gaps.set(i, half);
        }
      }
    }

    var ends = { head: gfx.head || null, tail: gfx.tail || gfx.head || null };
    var L = sideChain(centers, dirs, 1, s, w, ends, gaps);
    var R = sideChain(centers, dirs, -1, s, w, ends, gaps);

    var ring = L.segs.slice();
    ring.push(ends.tail ? { t: "M", p: R.segs[R.segs.length - 1].p }
                        : { t: "A", r: half, sweep: 1, p: R.segs[R.segs.length - 1].p });
    // Reversed right side: same arcs, opposite sweep, targets shifted by one.
    var pts = [R.start].concat(R.segs.map(function (g) { return g.p; }));
    for (i = R.segs.length - 1; i >= 0; i--) {
      ring.push({ t: R.segs[i].t, p: pts[i], r: R.segs[i].r, sweep: R.segs[i].sweep ? 0 : 1 });
    }
    ring.push(ends.head ? { t: "M", p: L.start }
                        : { t: "A", r: half, sweep: 1, p: L.start });

    var uses = [], last = centers.length - 1, dl = dirs[dirs.length - 1], d0 = dirs[0];
    if (ends.head) {
      uses.push(placeGraphic(ends.head,
        { x: centers[0].x - d0.x * (s / 2 - w), y: centers[0].y - d0.y * (s / 2 - w) },
        { x: -d0.x, y: -d0.y }, w, penPx));
    }
    if (ends.tail) {
      uses.push(placeGraphic(ends.tail,
        { x: centers[last].x + dl.x * (s / 2 - w), y: centers[last].y + dl.y * (s / 2 - w) },
        dl, w, penPx));
    }
    joiners.forEach(function (i) {
      var d = dirs[i];
      uses.push(placeGraphic(joiner,
        { x: centers[i].x - d.x * half, y: centers[i].y - d.y * half }, d, w, penPx));
    });

    return { d: ringToPath(L.start, ring), uses: uses };
  }

  // ---- growing ------------------------------------------------------------

  // A seeded generator so a plot can be reproduced later. mulberry32.
  function rngFrom(seed) {
    var a = seed >>> 0;
    return function () {
      a = a + 0x6D2B79F5 >>> 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  // Cell state while growing: 0 free, 1 taken by a horizontal run, 2 by a
  // vertical one, 3 taken but not crossable (corner, end, blocked), 4 already
  // crossed. Only 1 and 2 can be crossed, and only at a right angle.
  function grow(gw, gh, num, minLen, maxLen, seed, blocked, overlaps) {
    var rnd = rngFrom(seed);
    var axis = new Uint8Array(gw * gh), order = [], i;
    for (i = 0; i < gw * gh; i++) order.push(i);
    if (blocked) blocked.forEach(function (key) {
      var xy = key.split(","), x = +xy[0], y = +xy[1];
      if (x < gw && y < gh) axis[y * gw + x] = 3;
    });
    for (i = order.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1)), t = order[i];
      order[i] = order[j]; order[j] = t;
    }

    var crossings = new Map();

    // Where the walk can go from cell c: into a free neighbour, or straight
    // across an occupied one when the cell behind it is free too.
    function options(c) {
      var x = c % gw, y = Math.floor(c / gw), out = [];
      for (var k = 0; k < DIRS.length; k++) {
        var dx = DIRS[k][0], dy = DIRS[k][1];
        var nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
        var n = ny * gw + nx;
        if (axis[n] === 0) { out.push({ cells: [n], head: n }); continue; }
        if (!overlaps) continue;
        if (axis[n] !== (dx ? 2 : 1)) continue;
        var bx = nx + dx, by = ny + dy;
        if (bx < 0 || by < 0 || bx >= gw || by >= gh) continue;
        var b = by * gw + bx;
        if (axis[b] !== 0) continue;
        out.push({ cells: [n, b], head: b, cross: n });
      }
      return out;
    }

    // Once a noodle is done its straight cells become crossable.
    function settle(cells) {
      for (var i = 1; i < cells.length - 1; i++) {
        var cell = cells[i];
        if (axis[cell] === 4 || axis[cell] === 1 || axis[cell] === 2) continue;
        var dxIn = cells[i] % gw - cells[i - 1] % gw;
        var dxOut = cells[i + 1] % gw - cells[i] % gw;
        var dyIn = Math.floor(cells[i] / gw) - Math.floor(cells[i - 1] / gw);
        var dyOut = Math.floor(cells[i + 1] / gw) - Math.floor(cells[i] / gw);
        if (dxIn === dxOut && dyIn === dyOut) axis[cell] = dxIn ? 1 : 2;
      }
    }

    var noodles = [];
    for (var k = 0; k < order.length && noodles.length < num; k++) {
      var start = order[k];
      if (axis[start]) continue;
      axis[start] = 3;
      var target = minLen + Math.floor(rnd() * (maxLen - minLen + 1));
      var cells = [start], head = start, tail = start, atHead = true;

      while (cells.length < target) {
        var opts = options(atHead ? head : tail);
        if (!opts.length) {
          if (!atHead) break;            // both ends tried
          atHead = false;
          continue;
        }
        var pick = opts[Math.floor(rnd() * opts.length)];
        // Record the axis running underneath before overwriting it.
        if (pick.cross !== undefined) crossings.set(pick.cross, axis[pick.cross]);
        pick.cells.forEach(function (cell) { axis[cell] = 3; });
        if (pick.cross !== undefined) axis[pick.cross] = 4;
        if (atHead) {
          pick.cells.forEach(function (cell) { cells.push(cell); });
          head = pick.head;
        } else {
          pick.cells.forEach(function (cell) { cells.unshift(cell); });
          tail = pick.head;
        }
        // Straight cells become crossable right away, so a noodle can cross
        // its own body: one right, one up, one left, two down.
        settle(cells);
      }

      if (cells.length > 1) noodles.push(cells);
      else axis[start] = 0;              // a lone cell is no noodle
    }
    return { noodles: noodles, crossings: crossings };
  }

  // A noodle is underneath wherever it runs along the axis the crossing
  // recorded. The one going across it is on top and stays whole.
  function crossGapsFor(cells, crossings) {
    var out = [];
    for (var i = 1; i < cells.length - 1; i++) {
      var a = crossings.get(cells[i]);
      if (!a) continue;
      if ((Math.abs(cells[i + 1] - cells[i]) === 1 ? 1 : 2) === a) out.push(i);
    }
    return out;
  }

  // ---- drawing ------------------------------------------------------------

  var showGrid = false;
  var paintMode = false;        // click or drag cells to block them
  var blocked = new Set();      // "x,y" of cells noodles must avoid
  var maskImg = null;
  var gfx = {};                 // head, tail and joiner graphics, once loaded

  function read() {
    var g = function (id) { return document.getElementById(id); };
    var minLen = +g("minLen").value, maxLen = +g("maxLen").value;
    return {
      pw: +g("pw").value, ph: +g("ph").value,
      margin: +g("margin").value, pen: +g("pen").value,
      gw: +g("gw").value, gh: +g("gh").value,
      num: +g("num").value,
      minLen: Math.min(minLen, maxLen), maxLen: Math.max(minLen, maxLen),
      thick: +g("thick").value,
      joiners: +g("joiners").value, unit: unit,
      overlaps: g("overlaps").checked,
      seed: +g("seed").value || 0
    };
  }

  var current = null;

  // Everything on screen is in SVG user units: 96 per inch, whatever the panel
  // is set to.
  function layout(c) {
    var px = UNITS[c.unit].px;
    var W = c.pw * px, H = c.ph * px, m = c.margin * px;
    var s = Math.min((W - 2 * m) / c.gw, (H - 2 * m) / c.gh);
    return {
      W: W, H: H, s: s,
      ox: (W - s * c.gw) / 2, oy: (H - s * c.gh) / 2,
      w: s * c.thick, penPx: c.pen / 25.4 * DPI
    };
  }

  function draw(regrow) {
    var c = read(), L = layout(c);
    var W = L.W, H = L.H, s = L.s, ox = L.ox, oy = L.oy, w = L.w, penPx = L.penPx;

    if (regrow || !current) {
      current = grow(c.gw, c.gh, c.num, c.minLen, c.maxLen, c.seed, blocked, c.overlaps);
    }

    var parts = [];
    if (paintMode && blocked.size) {
      var rects = [];
      blocked.forEach(function (key) {
        var xy = key.split(","), x = +xy[0], y = +xy[1];
        if (x < c.gw && y < c.gh) {
          rects.push('<rect x="' + fmt(ox + x * s) + '" y="' + fmt(oy + y * s) +
                     '" width="' + fmt(s) + '" height="' + fmt(s) + '"/>');
        }
      });
      parts.push('<g id="blocked" fill="#6e5c40" fill-opacity=".18">' + rects.join("") + "</g>");
    }
    if (showGrid || paintMode) {   // painting blind is no fun
      var gl = [];
      for (var i = 0; i <= c.gw; i++) gl.push("M" + fmt(ox + i * s) + " " + fmt(oy) + "V" + fmt(oy + c.gh * s));
      for (var j = 0; j <= c.gh; j++) gl.push("M" + fmt(ox) + " " + fmt(oy + j * s) + "H" + fmt(ox + c.gw * s));
      parts.push('<path id="grid" d="' + gl.join(" ") + '" stroke="#6e5c40" stroke-opacity=".25" stroke-width="1" fill="none"/>');
    }
    var d = [], uses = [];
    current.noodles.forEach(function (cells, j) {
      var crossAt = crossGapsFor(cells, current.crossings);
      var r = noodleParts(cells, c.gw, s, ox, oy, w, gfx, c.joiners, c.seed, j, penPx, crossAt);
      d.push(r.d);
      uses = uses.concat(r.uses);
    });
    parts.push('<path d="' + d.join(" ") + '" fill="none" stroke="#4a3a28" stroke-opacity=".68" stroke-width="' +
               fmt(penPx) + '" stroke-linecap="round" stroke-linejoin="round"/>');
    if (uses.length) parts.push('<g id="gfx">' + uses.join("") + "</g>");

    svg.setAttribute("viewBox", "0 0 " + fmt(W) + " " + fmt(H));
    svg.style.aspectRatio = W + " / " + H;
    svg.innerHTML = parts.join("\n");

    var cellsUsed = current.noodles.reduce(function (a, n) { return a + n.length; }, 0);
    var open = c.gw * c.gh - countBlocked(c.gw, c.gh) + current.crossings.size;
    document.getElementById("stats").textContent =
      current.noodles.length + " noodles · " + current.crossings.size + " crossings · " +
      cellsUsed + "/" + open + " cells · " +
      fmt(s / DPI * 25.4) + " mm per cell · seed " + c.seed;
  }

  function countBlocked(gw, gh) {
    var n = 0;
    blocked.forEach(function (key) {
      var xy = key.split(",");
      if (+xy[0] < gw && +xy[1] < gh) n++;
    });
    return n;
  }

  // ---- painting blocked cells ---------------------------------------------

  function cellAt(ev) {
    var c = read(), L = layout(c);
    var box = svg.getBoundingClientRect();
    var px = (ev.clientX - box.left) / box.width * L.W;
    var py = (ev.clientY - box.top) / box.height * L.H;
    var x = Math.floor((px - L.ox) / L.s), y = Math.floor((py - L.oy) / L.s);
    if (x < 0 || y < 0 || x >= c.gw || y >= c.gh) return null;
    return x + "," + y;
  }

  var painting = false, paintAdds = true;

  svg.addEventListener("pointerdown", function (ev) {
    if (!paintMode) return;
    var key = cellAt(ev);
    if (!key) return;
    painting = true;
    paintAdds = !blocked.has(key);
    maskImg = null;                 // hand edits win over the loaded mask
    if (paintAdds) blocked.add(key); else blocked.delete(key);
    svg.setPointerCapture(ev.pointerId);
    draw(false);
  });
  svg.addEventListener("pointermove", function (ev) {
    if (!painting) return;
    var key = cellAt(ev);
    if (!key) return;
    if (paintAdds ? blocked.has(key) : !blocked.has(key)) return;
    if (paintAdds) blocked.add(key); else blocked.delete(key);
    draw(false);
  });
  addEventListener("pointerup", function () {
    if (!painting) return;
    painting = false;
    draw(true);                     // same seed, new layout around the mask
  });

  function setPaint(on) {
    paintMode = on;
    svg.style.cursor = on ? "crosshair" : "";
    document.getElementById("btnPaint").setAttribute("aria-pressed", on ? "true" : "false");
    draw(false);
  }

  // ---- mask image ---------------------------------------------------------

  // The image is scaled to fit the grid, any leftover space counts as blocked.
  // Cells over dark pixels are blocked, cells over light ones stay open.
  function applyMask() {
    if (!maskImg) return;
    var c = read();
    var cv = document.createElement("canvas");
    cv.width = c.gw; cv.height = c.gh;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, c.gw, c.gh);
    var sc = Math.min(c.gw / maskImg.width, c.gh / maskImg.height);
    var w = maskImg.width * sc, h = maskImg.height * sc;
    ctx.drawImage(maskImg, (c.gw - w) / 2, (c.gh - h) / 2, w, h);
    var d = ctx.getImageData(0, 0, c.gw, c.gh).data;
    blocked.clear();
    for (var y = 0; y < c.gh; y++) {
      for (var x = 0; x < c.gw; x++) {
        var i = (y * c.gw + x) * 4;
        if (d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114 < 128) blocked.add(x + "," + y);
      }
    }
  }

  document.getElementById("maskFile").addEventListener("change", function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        maskImg = img;
        applyMask();
        setPaint(true);
        draw(true);
      };
      img.src = reader.result;      // a data URL keeps the canvas readable
    };
    reader.readAsDataURL(file);
    ev.target.value = "";
  });

  // ---- graphics -----------------------------------------------------------

  var pendingSlot = "head";

  // A user picked file is not trusted markup: scripts and event handlers go.
  function scrub(root) {
    Array.prototype.forEach.call(root.querySelectorAll("script, style"), function (e) { e.remove(); });
    Array.prototype.forEach.call(root.querySelectorAll("*"), function (e) {
      Array.prototype.slice.call(e.attributes).forEach(function (a) {
        if (/^on/i.test(a.name) || a.name === "class") e.removeAttribute(a.name);
      });
    });
  }

  document.getElementById("gfxFile").addEventListener("change", function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var doc = new DOMParser().parseFromString(reader.result, "image/svg+xml");
      var root = doc.documentElement;
      if (root.nodeName !== "svg" || doc.querySelector("parsererror")) {
        document.getElementById("stats").textContent = "that file is not an SVG";
        return;
      }
      scrub(root);
      var vbAttr = root.getAttribute("viewBox");
      var vb = vbAttr ? vbAttr.trim().split(/[\s,]+/).map(Number)
                      : [0, 0, parseFloat(root.getAttribute("width")) || 100,
                            parseFloat(root.getAttribute("height")) || 100];
      var ser = new XMLSerializer(), inner = "";
      Array.prototype.forEach.call(root.childNodes, function (n) { inner += ser.serializeToString(n); });
      gfx[pendingSlot] = { vb: vb, inner: inner };
      if (pendingSlot === "joiner" && +document.getElementById("joiners").value === 0) {
        document.getElementById("joiners").value = .35;
        document.getElementById("v_joiners").textContent = ".35";
      }
      draw(false);
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  ["head", "tail", "join"].forEach(function (which) {
    document.getElementById("btn" + which[0].toUpperCase() + which.slice(1)).addEventListener("click", function () {
      pendingSlot = which === "join" ? "joiner" : which;
      document.getElementById("gfxFile").click();
    });
  });
  // Switching units keeps the sheet the same size, only the numbers change.
  document.getElementById("btnUnit").addEventListener("click", function () {
    var to = unit === "cm" ? "in" : "cm";
    var factor = UNITS[unit].px / UNITS[to].px;
    var cfg = UNITS[to];
    ["pw", "ph"].forEach(function (id) {
      var el = document.getElementById(id);
      el.min = cfg.paper.min; el.max = cfg.paper.max; el.step = cfg.paper.step;
      el.value = Math.round(+el.value * factor * 10) / 10;
    });
    var mar = document.getElementById("margin");
    mar.max = cfg.margin.max; mar.step = cfg.margin.step;
    mar.value = Math.round(+mar.value * factor * 10) / 10;
    document.getElementById("v_margin").textContent = mar.value;
    unit = to;
    this.textContent = to;
    draw(false);
  });

  document.getElementById("btnGfxReset").addEventListener("click", function () {
    gfx = {};
    draw(false);
  });

  // ---- panel --------------------------------------------------------------

  var panel = document.getElementById("panel"), toggle = document.getElementById("toggle");
  function setPanel(open) {
    if (open) panel.removeAttribute("hidden"); else panel.setAttribute("hidden", "");
    toggle.textContent = open ? "\u2039" : "\u203a";
  }
  toggle.addEventListener("click", function () { setPanel(panel.hasAttribute("hidden")); });
  if (matchMedia("(max-width: 680px), (max-height: 520px)").matches) setPanel(false);

  ["margin", "pen", "gw", "gh", "num", "minLen", "maxLen", "thick", "joiners"].forEach(function (id) {
    var el = document.getElementById(id), out = document.getElementById("v_" + id);
    function show() { out.textContent = el.value; }
    el.addEventListener("input", function () {
      show();
      if (id === "gw" || id === "gh") applyMask();
      // Grid size changes the cell layout, so the noodles have to grow again.
      draw(id === "gw" || id === "gh" || id === "num" || id === "minLen" || id === "maxLen");
    });
    show();
  });
  ["pw", "ph"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", function () { draw(false); });
  });

  function reseed() {
    document.getElementById("seed").value = Math.floor(Math.random() * 1e9);
    draw(true);
  }
  document.getElementById("seed").addEventListener("input", function () { draw(true); });
  document.getElementById("overlaps").addEventListener("change", function () { draw(true); });
  document.getElementById("btnRandom").addEventListener("click", reseed);
  document.getElementById("btnGrid").addEventListener("click", function () {
    showGrid = !showGrid;
    this.setAttribute("aria-pressed", showGrid ? "true" : "false");
    draw(false);
  });
  document.getElementById("btnSave").addEventListener("click", save);
  document.getElementById("btnPaint").addEventListener("click", function () { setPaint(!paintMode); });
  document.getElementById("btnMask").addEventListener("click", function () {
    document.getElementById("maskFile").click();
  });
  document.getElementById("btnClear").addEventListener("click", function () {
    blocked.clear(); maskImg = null; draw(true);
  });

  function save() {
    var c = read();
    var clone = svg.cloneNode(true);
    ["#grid", "#blocked"].forEach(function (sel) {
      var g = clone.querySelector(sel);
      if (g) g.remove();
    });
    clone.removeAttribute("style");
    clone.setAttribute("width", c.pw + c.unit);
    clone.setAttribute("height", c.ph + c.unit);
    // The settings ride along in a comment, so any plot can be regenerated.
    var head = '<?xml version="1.0" encoding="UTF-8"?>\n<!-- generative-noodles ' +
               JSON.stringify(c) + ' -->\n';
    var blob = new Blob([head + clone.outerHTML], { type: "image/svg+xml" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "noodles-" + c.seed + ".svg";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    var k = e.key.toLowerCase();
    if (k === "r") reseed();
    else if (k === "g") { showGrid = !showGrid; draw(false); }
    else if (k === "s") { e.preventDefault(); save(); }
    else if (k === "h") setPanel(panel.hasAttribute("hidden"));
    else if (k === "x") setPaint(!paintMode);
    else if (k === "i") document.getElementById("maskFile").click();
  });

  document.getElementById("seed").value = Math.floor(Math.random() * 1e9);
  draw(true);

  // ---- self check: index.html?test=1 --------------------------------------
  if (location.search.indexOf("test=1") >= 0) try {
    var ok = 0;
    function eq(a, b, what) {
      if (Math.abs(a - b) > 1e-6) throw new Error(what + ": " + a + " != " + b);
      ok++;
    }
    // A straight three-cell noodle: cells 0,1,2 of a 3x1 grid, s=100, w=60.
    // Its outline is a 260 x 60 pill whose caps end flush with the outer cell
    // edges at x=0 and x=300.
    var straight = noodleParts([0, 1, 2], 3, 100, 0, 0, 60, {}, 0, 1, 0, 1).d;
    var pts = [];
    straight.replace(/([MLA])([^MLAZ]*)/g, function (_, cmd, rest) {
      var v = rest.trim().split(/[ ,]+/).map(Number);
      pts.push({ x: v[v.length - 2], y: v[v.length - 1] });
      return "";
    });
    var xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
    eq(pts[0].x, 30, "cap joint sits w/2 inside the outer cell edge");
    eq(pts[0].y, 20, "left side runs w/2 above the centre line");
    eq(Math.min.apply(null, xs), 30, "leftmost outline point");
    eq(Math.max.apply(null, xs), 270, "rightmost outline point");
    eq(Math.min.apply(null, ys), 20, "top of the noodle");
    eq(Math.max.apply(null, ys), 80, "bottom of the noodle");

    // Growing never puts two noodles in one cell.
    var ns = grow(12, 12, 40, 3, 10, 42, null, false).noodles, seen = {};
    ns.forEach(function (n) { n.forEach(function (c) {
      if (seen[c]) throw new Error("cell " + c + " used twice");
      seen[c] = 1;
    }); });
    ok++;
    // Same seed, same noodles.
    eq(JSON.stringify(grow(12, 12, 40, 3, 10, 42, null, false).noodles) === JSON.stringify(ns) ? 1 : 0, 1,
       "the seed reproduces a run");
    eq(JSON.stringify(grow(12, 12, 40, 3, 10, 43, null, false).noodles) === JSON.stringify(ns) ? 0 : 1, 1,
       "a different seed gives a different run");
    // A joiner cuts the outline open and places one graphic.
    var withJoiner = noodleParts([0, 1, 2], 3, 100, 0, 0, 60, {}, 1, 1, 0, 1);
    eq(withJoiner.uses.length, 1, "one joiner graphic on the middle cell");
    eq((withJoiner.d.match(/M/g) || []).length, 2, "the outline is cut into two runs");
    eq(withJoiner.d.indexOf("Z"), -1, "a cut outline is no longer closed");

    // An end graphic replaces the cap and shortens the outline by half a width.
    var capped = noodleParts([0, 1, 2], 3, 100, 0, 0, 60,
                             { head: { vb: [0, 0, 100, 100], inner: "<path d=\"M0,100\"/>" } }, 0, 1, 0, 1);
    eq(capped.uses.length, 2, "head graphic used at both ends");
    eq(capped.d.indexOf("Z"), -1, "an outline with end graphics is open");

    // With crossings on, a crossed cell sits in exactly two noodles and both
    // of them run straight through it.
    var run = grow(20, 20, 60, 4, 14, 5, null, true);
    if (!run.crossings.size) throw new Error("no crossings at all");
    run.crossings.forEach(function (under, cell) {
      var visits = 0;
      run.noodles.forEach(function (n) {
        n.forEach(function (c, i) {
          if (c !== cell) return;
          visits++;
          if (i === 0 || i === n.length - 1) throw new Error("a noodle ends on a crossing");
          if ((n[i] - n[i - 1]) !== (n[i + 1] - n[i])) throw new Error("a noodle turns on a crossing");
        });
      });
      if (visits !== 2) throw new Error("crossed cell visited " + visits + " times");
    });
    ok++;

    // Across the whole drawing: every crossing is cut exactly once, on the run
    // underneath, and left whole on the run going over it.
    (function () {
      var gapCount = new Map();
      run.noodles.forEach(function (n) {
        crossGapsFor(n, run.crossings).forEach(function (i) {
          gapCount.set(n[i], (gapCount.get(n[i]) || 0) + 1);
        });
      });
      run.crossings.forEach(function (a, cell) {
        if (gapCount.get(cell) !== 1) {
          throw new Error("cell " + cell + " cut " + (gapCount.get(cell) || 0) + " times");
        }
      });
      ok++;
    })();

    // One right, one up, one left, two down: the noodle passes over itself, and
    // the gap belongs to the horizontal run, not the vertical one.
    var selfCross = [10, 11, 12, 13, 8, 7, 12, 17];   // gw 5, cell 12 twice
    var gapsAt = crossGapsFor(selfCross, new Map([[12, 1]]));
    eq(gapsAt.length, 1, "one gap on a self crossing");
    eq(gapsAt[0], 2, "the gap sits on the horizontal pass");
    eq(crossGapsFor(selfCross, new Map([[12, 2]]))[0], 6, "mirrored, the gap moves to the vertical pass");

    // The lower noodle of a crossing is cut open, the upper one is not.
    var lower = run.noodles[0], cut = crossGapsFor(lower, run.crossings);
    if (cut.length) {
      var over = noodleParts(lower, 20, 100, 0, 0, 60, {}, 0, 1, 0, 1, cut);
      var plain = noodleParts(lower, 20, 100, 0, 0, 60, {}, 0, 1, 0, 1, []);
      eq((over.d.match(/M/g) || []).length, 2 * cut.length, "each crossing cuts both sides");
      eq(plain.d.indexOf("Z") >= 0 ? 1 : 0, 1, "without crossings it stays one closed path");
    }

    // A click on the middle of cell 3,2 maps back to that cell.
    var L0 = layout(read());
    var box = svg.getBoundingClientRect();
    var hit = cellAt({
      clientX: box.left + (L0.ox + 3.5 * L0.s) / L0.W * box.width,
      clientY: box.top + (L0.oy + 2.5 * L0.s) / L0.H * box.height
    });
    eq(hit === "3,2" ? 1 : 0, 1, "a screen click maps back to its cell, got " + hit);

    // 25.4 cm and 10 in are the same sheet, to the user unit.
    var inches = layout({ pw: 10, ph: 8, margin: 1, gw: 10, gh: 10, thick: .5, pen: .5, unit: "in" });
    var metric = layout({ pw: 25.4, ph: 20.32, margin: 2.54, gw: 10, gh: 10, thick: .5, pen: .5, unit: "cm" });
    eq(inches.W, metric.W, "same sheet width in either unit");
    eq(inches.s, metric.s, "same cell size in either unit");

    // Blocked cells stay empty.
    var wall = new Set();
    for (var bx = 0; bx < 12; bx++) wall.add(bx + ",5");
    grow(12, 12, 40, 3, 10, 7, wall, true).noodles.forEach(function (n) {
      n.forEach(function (cell) {
        if (Math.floor(cell / 12) === 5) throw new Error("noodle crossed a blocked row");
      });
    });
    ok++;
    document.title = "self check passed, " + ok + " assertions";
  } catch (err) { document.title = "SELF CHECK FAILED: " + err.message; }
})();
</script>
</body>
</html>
